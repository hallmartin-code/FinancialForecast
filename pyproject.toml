[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitchdeck-cfo"
version = "0.1.0"
description = "Turns an early-stage investor deck into an auditable financial model and a one-page investor summary"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TEN Capital Network" }]

dependencies = [
    # Capped below 1.0 deliberately. anthropic 1.x is a different SDK generation --
    # it swapped its HTTP stack from httpx to httpx2 -- and extraction is the stage
    # this project least wants running on an untested major. Lift the cap as a
    # deliberate, tested change, never as a side effect of a fresh resolve.
    "anthropic>=0.40,<1",    # extraction passes (tool-use / structured output)
    "pydantic>=2",           # every stage boundary is a validated model
    "pydantic-settings>=2",  # env/.env config binding
    "typer>=0.12",           # CLI
    "rich>=13",              # progress + tables + actionable errors
    "pypdf>=4.2",            # PDF text extraction
    "pdfplumber>=0.11",      # PDF table extraction
    "python-pptx>=1.0",      # PPTX shapes, tables, speaker notes
    "pandas>=2.2",           # modelling engine
    "numpy>=1.26",
    "reportlab>=4.1",        # one-pager PDF
    "matplotlib>=3.8",       # charts embedded in both outputs
    "openpyxl>=3.1",         # formula-driven workbook
    "PyYAML>=6",             # assumptions.yaml
    "python-dotenv>=1.0",
    "httpx>=0.27,<1",        # notify.py posts to Resend with it, so it is declared here
]

[project.optional-dependencies]
# The deployed web app. Kept out of the core install so the CLI stays lean.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # FastAPI needs this for multipart uploads
]
# Scanned-deck fallback. Also needs the tesseract and poppler binaries on PATH,
# which pip cannot install -- ingest/ocr.py checks for them and says so.
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "syrupy>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "types-openpyxl",
    "formulas>=1.3",  # evaluates the workbook so its formulas can be tested, not assumed
    "pitchdeck-cfo[ocr]",
    "pitchdeck-cfo[web]",
    "pymupdf>=1.24",  # rasterises the one-pager for visual checks
]

[project.scripts]
pitchdeck-cfo = "pitchdeck_cfo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchdeck_cfo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection idiom is a call in an argument default, which
# B008 exists to catch elsewhere. Declaring them immutable is the documented fix and
# beats scattering noqa comments across every route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
]

[tool.mypy]
# No python_version pin: it would be checked against whichever interpreter's
# third-party stubs are installed, and numpy's current stubs use 3.12+ syntax that
# a 3.11 pin cannot parse. mypy defaults to the running interpreter, so CI (3.11)
# verifies the floor and local runs verify the version actually in use.
packages = ["pitchdeck_cfo"]
mypy_path = "src"
strict = true
warn_unreachable = true
# reportlab, pdfplumber, pptx, pdf2image and pytesseract ship no type information.
# Everything we own stays strict; only these third-party imports are exempt.
[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "pdfplumber.*",
    "pptx.*",
    "pdf2image.*",
    "pytesseract.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "smoke: end-to-end runs against real decks outside the repo; skipped when absent",
    "llm: requires a live Anthropic API key; skipped in CI",
    "slow: compiles the workbook with a spreadsheet engine; seconds, not milliseconds",
]

[tool.coverage.run]
source = ["pitchdeck_cfo"]
