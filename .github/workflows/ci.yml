name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src/
      # No ANTHROPIC_API_KEY in CI: extraction tests use a mocked client and the
      # `llm` and `smoke` markers are deselected.
      - run: pytest -m "not llm and not smoke" --cov
      # The workbook equivalence tests compile every formula with a spreadsheet
      # engine. Slow, and the single most important thing the suite checks, so
      # they run as their own step rather than being quietly skipped.
      - run: pytest -m "slow and not llm" -q
